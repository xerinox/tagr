# Example tagr configuration file
# Copy this to ~/.config/tagr/config.toml and customize as needed

# The default database to use when none is specified
default_database = "default"

# Map of database names to their filesystem paths
[databases]
default = "~/.local/share/tagr/default"
# project2 = "~/.local/share/tagr/project2"

# Suppress informational output by default
quiet = false

# Default format for displaying paths: "absolute", "relative", or "basename" (default: "absolute")
path_format = "absolute"

# UI configuration
[ui]
# Fuzzy finder backend: "Skim" or "Custom" (default: "Skim")
backend = "Skim"

# Preview pane configuration
[preview]
# Enable preview pane
enabled = true

# Maximum file size to preview (bytes, default: 5MB)
max_file_size = 5242880

# Enable syntax highlighting (default: true)
syntax_highlighting = true

# Show line numbers (default: true)
show_line_numbers = true

# Position of preview pane: "Right", "Bottom", "Top", or "Left" (default: "Right")
position = "Right"

# Width percentage 0-100 (default: 50)
width_percent = 50

# Notes configuration
[notes]
# Storage mode: "integrated" (database)
storage = "integrated"

# Editor command for editing notes
# If not set, falls back to $EDITOR environment variable, then "vim"
# editor = "nvim"
# editor = "code --wait"

# Maximum note size in kilobytes (default: 100)
# Notes exceeding this size will trigger a warning
max_note_size_kb = 100

# Default template for new notes (optional)
# Use this to pre-populate new notes with a template
default_template = ""


# Enable hierarchy expansion in searches
# When true, searching for a tag includes its parent tags
# Use --no-hierarchy flag to opt out per search
auto_expand_hierarchy = true

# The tag_schema.toml file is created automatically when you add your first alias
# Location: ~/.config/tagr/tag_schema.toml
#
# Example tag_schema.toml structure:
#
# [aliases]
# # Map aliases to canonical tags
# js = "javascript"
# py = "python"
# ts = "lang:typescript"
# es6 = "javascript"
#
# # Hierarchical tags use colon delimiter
# # Searching for "lang:rust" automatically includes "lang:rust:async", "lang:rust:web", etc.
# # No explicit hierarchy configuration needed - automatically inferred from tag names
#
# # The schema file can be edited manually, but use the CLI for safety:
# #   tagr alias add <alias> <canonical>
# #   tagr alias remove <alias>
# #   tagr alias list
# #
# # Validation rules:
# # - Alias names cannot contain ':' (reserved for hierarchies)
# # - Circular references are prevented (A→B→A)
# # - Case-insensitive matching
# # - Self-references allowed but not recommended
