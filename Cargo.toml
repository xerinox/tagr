[package]
name = "tagr"
description = "A fast, tag-based file organizer and search tool for the command line."
version = "1.0.0-alpha.1"
authors = ["Rainer Kildal <rkildal@gmail.com>"]
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/xerinox/tagr"
keywords = ["search", "tag", "organization", "cli"]

[features]
default = ["syntax-highlighting"]
syntax-highlighting = ["dep:syntect"]
dynamic-completions = ["clap_complete/unstable-dynamic"]

[dependencies]
arboard = "3.6"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6"
colored = "3.1"
minus = { version = "5.7", features = ["search", "static_output", "dynamic_output"] }
config = "0.15.23"
dialoguer = "0.12"
dirs = "6.0.0"
glob = "0.3"
gix = { version = "0.84", default-features = false, features = [
    "sha1", "status", "revision", "parallel",
] }
moka = { version = "0.12", features = ["sync"] }
byte-unit = { version = "5.2", default-features = false, features = ["std", "byte"] }
open = "5.3"
rayon = "1.12"
regex = "1.12"
serde = { version = "1.0.228", features = ["derive"] }
sled = "0.34.7"
thiserror = "2.0.18"
toml = "1.1"
serde_json = "1.0"
csv = "1.4"
heck = "0.5"
strsim = "0.11"

# Watch mode dependencies
notify = "8.2"
interprocess = { version = "2.4", features = ["tokio"] }
tokio = { version = "1.52", features = ["full"] }
anyhow = "1.0"
async-trait = "0.1"

# TUI dependencies
nucleo = "0.5"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }

# Optional syntax highlighting (using fancy-regex for cross-platform support)
syntect = { version = "5.3", optional = true, default-features = false, features = ["default-fancy"] }
wincode = { version = "0.5.5", features = ["derive"] }
notify-debouncer-full = "0.7.0"
postcard = { version = "1.1.3", features = ["alloc"] }
log = "0.4.32"
env_logger = "0.11.10"

[dev-dependencies]
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[lints.clippy]
pedantic = "warn"
nursery = "warn"

[target."cfg(unix)".dependencies]
daemonize = "0.5.0"
